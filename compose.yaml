services:
  # Production-only HTTPS gateway. Local development keeps using port 8080.
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_URL: redis://redis:6379/1
      DB_HOST: db
      DB_PORT: "5432"
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      API_ROOT_PATH: /api
      API_REQUEST_TELEMETRY_ENABLED: ${API_REQUEST_TELEMETRY_ENABLED:-true}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PANEL_USERNAME: ${PANEL_USERNAME:-admin}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Önce scripts/setup_access.py çalıştırın}
      INGEST_API_KEY: ${INGEST_API_KEY:?Önce scripts/setup_access.py çalıştırın}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PANEL_ALLOWED_ORIGINS: ${DOCKER_PANEL_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    # API dışarıya port açmaz; istemci adresini yalnızca web proxy'si iletir.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # Production-only telemetry agent; reads Linux host counters and sends metrics to the internal API.
  host-agent:
    profiles: ["production"]
    build: .
    command: ["python", "host_agent.py"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      HOST_AGENT_API_URL: http://api:8000
      INGEST_API_KEY: ${INGEST_API_KEY:?Önce scripts/setup_access.py çalıştırın}
      HOST_AGENT_SERVICE: ${HOST_AGENT_SERVICE:-artersoft-vm}
      HOST_AGENT_HOST: ${HOST_AGENT_HOST:-artersoft-vm}
      HOST_AGENT_INTERVAL_SECONDS: ${HOST_AGENT_INTERVAL_SECONDS:-30}
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_URL: redis://redis:6379/1
      DB_POOL_MAX: "2"
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  db-init:
    image: timescale/timescaledb:latest-pg17
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.sql:/schema.sql:ro
      - ./migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/schema.sql", "-f", "/migrations/001_alerting.sql", "-f", "/migrations/002_batch_ingestion.sql", "-f", "/migrations/003_api_request_tasks.sql"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  pg_data:

