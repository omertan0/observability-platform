# Docker servis adresi değiştiğinde API yeniden bulunur.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream observability_api {
    zone observability_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Göreli yönlendirmeler dış portu ve ilerideki HTTPS adresini korur.
    absolute_redirect off;
    client_max_body_size 8m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # /api/logs isteği FastAPI'ye /logs olarak gider.
        proxy_pass http://observability_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Caddy dış proxy'dir; onun doğruladığı istemci IP'sini ve HTTPS bilgisini API'ye aktar.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        # SSE bildirimlerinin Nginx tamponunda beklememesi gerekir.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        # /docs/ gibi yolların yönlendirmesi de /api altında kalmalı.
        # API öneki zaten varsa ikinci kez eklenmez.
        proxy_redirect ~^https?://[^/]+(/(?!api(?:/|$)).*)$ /api$1;
        proxy_redirect ~^(/(?!api(?:/|$)).*)$ /api$1;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
